name: Auto Merge PR to Dev

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - dev

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Wait for GitHub to calculate mergeability
        run: sleep 10

      - name: Merge PR if mergeable
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pull_number = context.payload.pull_request.number;

            // Get latest PR information
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number
            });

            console.log(`Mergeable: ${pr.mergeable}`);
            console.log(`Mergeable State: ${pr.mergeable_state}`);

            if (pr.mergeable === true) {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number,
                merge_method: "merge"
              });

              console.log("✅ PR merged successfully.");
            } else {
              console.log("❌ PR is not mergeable. Skipping merge.");
            }
